name: Daily 07:00 Morning Briefing

on:
  schedule:
    - cron: "0 23 * * *"  # Fallback: 07:00 Beijing (UTC+8); skipped automatically if iPhone 07:00 Shortcut already ran today
  workflow_dispatch:
    inputs:
      force:
        description: "Force regenerate even if today's briefing already exists (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BARK_URL: ${{ secrets.BARK_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefing & push to Bark
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python generate_briefing.py --force
          else
            python generate_briefing.py
          fi

      - name: Commit briefing & GitHub Pages
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "briefing $(date '+%Y-%m-%d')"
          git pull --rebase -X ours origin main
          git push
